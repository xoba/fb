# Serve the catalog directory read-only with a short listing.
ServerName catalog.example.com
DocumentRoot "/srv/catalog"

<Directory "/srv/catalog">
    Options +Indexes -ExecCGI
    IndexOptions FancyIndexing NameWidth=*
    AllowOverride None
    Require all granted
</Directory>

AddType text/markdown .md
AddType message/rfc822 .eml
