# Squid cache settings for the example.com catalog mirror.
http_port 3128
visible_hostname catalog.example.com

acl localnet src 10.0.0.0/8
acl catalog_site dstdomain .example.com
acl Safe_ports port 80 443

http_access deny !Safe_ports
http_access allow localnet catalog_site
http_access deny all

cache_mem 64 MB
maximum_object_size 4 MB
cache_dir ufs /var/spool/squid 100 16 256
refresh_pattern -i \.(md|eml)$ 60 50% 1440
access_log /var/log/squid/access.log squid
