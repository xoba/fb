#
# /etc/pacman.conf
# Official repositories plus the catalog tools served from example.com.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
Color
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[catalog]
SigLevel = Optional TrustAll
Server = https://example.com/archlinux/$repo/$arch
