# Serve the example catalog as static files.
worker_processes 1;

events {
    worker_connections 64;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    server {
        listen      8080;
        server_name example.com;
        root        /srv/catalog;

        location / {
            autoindex on;
        }

        location ~ \.(md|eml)$ {
            default_type text/plain;
            charset      utf-8;
        }
    }
}
